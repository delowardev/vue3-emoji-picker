name: Test Automation
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run prettier
      - run: npm run test:once
      - run: npm run build

      # Publishability gates: these catch broken `exports`, missing types and
      # ESM-that-is-treated-as-CJS before a release does.
      - run: npm run check:publish

      # Importing the built ESM entry in plain Node must not throw or leak an
      # unhandled rejection (the indexedDB regression).
      - run: npm run test:ssr

      # The packed tarball must contain only what we intend to publish.
      - run: npm run test:pack

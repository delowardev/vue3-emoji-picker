name: Update Emoji Data
on:
  schedule:
    # Mondays, 04:23 UTC
    - cron: '23 4 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: 'emoji-datasource version (default: latest on npm)'
        required: false
        default: ''
      force:
        description: 'Regenerate even if the version is not newer'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-emoji-data
  cancel-in-progress: false

jobs:
  check:
    name: Check emoji-datasource version
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.check.outputs.current }}
      latest: ${{ steps.check.outputs.latest }}
      outdated: ${{ steps.check.outputs.outdated }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: check
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/update-emoji-data.mjs --check $VERSION

  update:
    name: Update emoji data
    needs: check
    if: needs.check.outputs.outdated == 'true' || inputs.force
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
      LATEST: ${{ needs.check.outputs.latest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Regenerate data
        run: |
          npm run data:update -- "$LATEST" --summary-file "$RUNNER_TEMP/summary.md"

      - run: npm run type-check
      - run: npm run prettier
      - run: npm run test:once
      - run: npm run build

      - name: Write PR body
        run: |
          {
            echo 'Automated update of the bundled emoji data and the artwork version'
            echo '(`EMOJI_DATASOURCE_VERSION`), generated by `npm run data:update`.'
            echo
            echo 'Type-check, tests and build passed in the workflow run. PRs opened'
            echo 'with `GITHUB_TOKEN` do not trigger other workflows, so close and'
            echo 'reopen this PR (or push to it) to run the full Test Automation suite.'
            echo
            cat "$RUNNER_TEMP/summary.md"
          } > "$RUNNER_TEMP/body.md"

      - name: Open or update pull request
        # peter-evans/create-pull-request v8.1.1
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          branch: automation/emoji-data
          delete-branch: true
          add-paths: |
            src/data/emojis.json
            src/data/groups.json
            src/core/images.ts
          commit-message: 'chore: update emoji data to emoji-datasource ${{ needs.check.outputs.latest }}'
          title: 'chore: update emoji data to emoji-datasource ${{ needs.check.outputs.latest }}'
          body-path: ${{ runner.temp }}/body.md
